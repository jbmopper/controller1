[project]
name = "controller1-analysis"
version = "0.1.0"
description = "Analysis notebooks/scripts for controller1 results"
requires-python = ">=3.12, <3.13"
dependencies = [
  # Core analysis
  "numpy",
  "pandas",
  # Plotting
  "matplotlib",
  "seaborn",
  "plotly",
  # Reactive notebooks (stored as .py)
  "marimo",
  "pyzmq>=27.1.0",
]

[tool.uv]
# Keep this analysis environment self-contained under analysis/.venv
managed = true

